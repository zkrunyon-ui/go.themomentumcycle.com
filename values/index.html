<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Values Assessment | The Momentum Cycle</title>
<meta name="description" content="A free, 5-minute reflection to discover your top five personal values. Take it with your spouse to compare." />
<meta property="og:title" content="Values Assessment | The Momentum Cycle" />
<meta property="og:description" content="Discover your top five values in 5 minutes. Take it with your spouse to see how your values connect." />
<meta property="og:image" content="https://raw.githubusercontent.com/zkrunyon-ui/assets/main/logo.png" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0F3D2E;
    --green-2: #1F5A45;
    --sage: #BFCFC4;
    --sage-light: #DDE7DD;
    --cream: #FAF7F0;
    --text: #1A1A1A;
    --muted: #5A6760;
    --divider: #E5DFD0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .serif {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-feature-settings: "ss01" on;
  }

  /* Header */
  header {
    background: var(--cream);
    border-bottom: 1px solid var(--divider);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--green);
    letter-spacing: -0.01em;
  }
  header .brand-sub {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }
  header img { height: 36px; opacity: 0.92; }

  /* Layout: flex column so footer sticks to bottom */
  main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
  }
  .wrap {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 32px 80px;
    flex: 1 0 auto;
  }

  /* Decorative SVG accents */
  .deco {
    position: absolute;
    pointer-events: none;
    opacity: 0.5;
    z-index: 0;
  }
  .stage-area { position: relative; }
  .stage-area > * { position: relative; z-index: 1; }

  /* Typography */
  h1.hero {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--green);
    margin: 0 0 20px;
  }
  h1.hero em {
    font-style: italic;
    font-weight: 400;
    color: var(--green-2);
  }
  .lead {
    font-size: 18px;
    line-height: 1.6;
    color: var(--text);
    max-width: 580px;
    margin: 0 0 36px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--green-2);
    margin: 0 0 24px;
  }
  .eyebrow::before {
    content: "";
    width: 28px;
    height: 1px;
    background: var(--green-2);
  }

  /* Form */
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 460px;
  }
  .field label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input[type="email"], input[type="text"] {
    width: 100%;
    padding: 16px 18px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    border: 1px solid var(--sage);
    border-radius: 4px;
    background: #fff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="email"]:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(15,61,46,0.08);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--green);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 15px 28px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    margin-top: 22px;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--green-2); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--green);
    border: 1px solid var(--sage);
    padding: 14px 24px;
  }
  .btn-ghost:hover { background: var(--sage-light); border-color: var(--green-2); }

  /* Hero (email step) */
  .hero-single { max-width: 620px; }
  @media (max-width: 720px) {
    h1.hero { font-size: 38px; }
    .wrap { padding: 32px 24px 56px; }
    header { padding: 14px 20px; }
  }

  /* Progress */
  .progress-bar {
    height: 2px;
    background: var(--sage-light);
    border-radius: 0;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width .3s ease;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
  }
  .progress-meta strong { color: var(--green); font-weight: 600; }

  /* Question */
  .q-num {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .q-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    color: var(--green);
    font-size: 32px;
    line-height: 1.2;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }
  .q-title em { font-style: italic; color: var(--green-2); }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: #fff;
    border: 1px solid var(--sage);
    border-radius: 3px;
    padding: 18px 22px;
    font-size: 15.5px;
    line-height: 1.45;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--text);
  }
  .option:hover {
    border-color: var(--green-2);
    background: #fff;
    transform: translateX(2px);
  }
  .option .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--sage);
    flex-shrink: 0;
    position: relative;
    transition: border-color .15s;
  }
  .option:hover .dot { border-color: var(--green-2); }
  .option.selected {
    border-color: var(--green);
    background: var(--sage-light);
  }
  .option.selected .dot {
    border-color: var(--green);
    background: var(--green);
    box-shadow: inset 0 0 0 3px var(--sage-light);
  }

  .live-stage {
    margin-top: 28px;
    padding: 14px 18px;
    background: var(--sage-light);
    border-left: 2px solid var(--green-2);
    font-size: 13px;
    color: var(--green);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .live-stage em {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
  }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; }

  /* Result card */
  .result-card {
    background: #fff;
    border: 1px solid var(--divider);
    border-radius: 4px;
    padding: 40px;
    margin: 28px 0 8px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--green) 0%, var(--green-2) 100%);
  }
  .result-stage-num {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .result-stage-name {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    color: var(--green);
    font-size: 44px;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    line-height: 1.05;
  }
  .result-desc {
    font-size: 16.5px;
    line-height: 1.6;
    color: var(--text);
  }

  /* Auto-send status indicator on result screen */
  .send-status {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 32px;
    padding: 16px 20px;
    border-radius: 3px;
    font-size: 14px;
    line-height: 1.5;
  }
  .send-status.sending {
    background: var(--sage-light);
    color: var(--green);
    border-left: 2px solid var(--green-2);
  }
  .send-status.sent {
    background: var(--sage-light);
    color: var(--green);
    border-left: 2px solid var(--green);
  }
  .send-status.error {
    background: #FBEBEA;
    color: #7A2820;
    border-left: 2px solid #C0392B;
  }
  .send-status .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--sage);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  .send-status .check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--green);
    color: var(--cream);
    flex-shrink: 0;
  }
  .send-status a { color: inherit; text-decoration: underline; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Success */
  .success {
    text-align: center;
    padding: 80px 20px 40px;
    max-width: 520px;
    margin: 0 auto;
  }
  .success .checkmark {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--green);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  /* Footer — anchored at bottom via flex layout */
  footer {
    flex-shrink: 0;
    background: var(--green);
    color: var(--cream);
    padding: 32px;
    text-align: center;
  }
  footer .foot-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  footer .foot-brand {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  footer .foot-meta {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(250,247,240,0.7);
  }
  footer a { color: var(--cream); text-decoration: none; border-bottom: 1px solid rgba(250,247,240,0.3); }

  /* Revamp additions */
  .form-error { color: #8a2a1f; font-size: 14px; min-height: 20px; margin: 12px 0 0; }
  .constraint-card {
    background: var(--sage-light);
    border-left: 3px solid var(--green);
    border-radius: 4px;
    padding: 24px 28px;
    margin: 20px 0 8px;
  }
  .constraint-card .constraint-name { font-size: 30px; color: var(--green); font-weight: 500; margin-bottom: 10px; }
  .constraint-card p { margin: 6px 0; }
  .turnstile-box { margin: 16px 0 0; }
  .option:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* Values page */
  .sub { color: var(--muted); margin: -6px 0 24px; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .vcard { text-align: left; background: #fff; border: 1px solid var(--sage); border-radius: 4px; padding: 14px 16px;
    font: inherit; color: var(--text); cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s; }
  .vcard:hover:not(:disabled) { border-color: var(--green-2); }
  .vcard.on { background: var(--green); border-color: var(--green); color: var(--cream); }
  .vcard.on .vshort { color: rgba(250,247,240,.8); }
  .vcard:disabled { opacity: .45; cursor: not-allowed; }
  .vcard:focus-visible, .rb:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .vlabel { font-weight: 600; font-size: 15.5px; }
  .vshort { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .rank { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .rank li { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--sage); border-radius: 4px; padding: 12px 14px; }
  .rnum { font-family: 'Fraunces', Georgia, serif; font-size: 24px; color: var(--green); width: 26px; text-align: center; }
  .rlabel { flex: 1; font-weight: 600; }
  .rbtns { display: flex; gap: 6px; }
  .rb { width: 40px; height: 40px; border: 1px solid var(--sage); background: var(--cream); color: var(--green); border-radius: 4px; cursor: pointer; font-size: 13px; }
  .rb:disabled { opacity: .3; cursor: default; }
  .spouse { margin-top: 28px; padding: 20px 22px; background: var(--sage-light); border-radius: 4px; max-width: 500px; }
  .spouse .field { max-width: none; }
  .spouse-title { font-weight: 600; margin-bottom: 6px; } .spouse-title span { font-weight: 400; color: var(--muted); }
  .vresult { list-style: none; padding: 0; margin: 24px 0 8px; background: #fff; border: 1px solid var(--divider); border-radius: 4px; }
  .vresult li { display: flex; gap: 18px; padding: 20px 24px; border-bottom: 1px solid var(--divider); }
  .vresult li:last-child { border-bottom: 0; }
  .vr-num { font-family: 'Fraunces', Georgia, serif; font-style: italic; color: var(--muted); font-size: 15px; padding-top: 6px; min-width: 24px; }
  .vr-label { font-size: 26px; color: var(--green); line-height: 1.15; margin-bottom: 4px; }
  .vr-desc { color: var(--text); line-height: 1.55; }
  .spouse-note { margin-top: 20px; } .spouse-note p { margin: 0 0 12px; }
  @media (max-width: 720px) { .vresult li { padding: 16px 16px; gap: 12px; } .vr-label { font-size: 22px; } }

  /* Header + footer matched to themomentumcycle.com (Squarespace: Roboto, dark green #0A3323, cream text) */
  header.site { background: #0A3323; border-bottom: 0; padding: 22px 4vw; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header.site .site-title { font-family: 'Roboto', sans-serif; font-weight: 400; font-size: 1.7rem; letter-spacing: -.02em; line-height: 1.1;
    text-transform: uppercase; color: #F9F7E0; text-decoration: none; }
  header.site .site-cta { font-family: 'Roboto', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: -.01em; color: #F9F7E0;
    border: 1px solid #F9F7E0; border-radius: 300px; padding: 12px 22px; text-decoration: none; white-space: nowrap; transition: background .15s, color .15s; }
  header.site .site-cta:hover { background: #F9F7E0; color: #0A3323; }
  footer.site { background: #0A3323; color: #F9F7E0; padding: 40px 4vw; text-align: center; font-family: 'Roboto', sans-serif; flex-shrink: 0; }
  footer.site .foot-title { font-size: 1.4rem; letter-spacing: -.02em; text-transform: uppercase; margin-bottom: 10px; }
  footer.site a { color: #F9F7E0; font-size: 15px; letter-spacing: -.01em; text-decoration: none; border-bottom: 1px solid rgba(249,247,224,.4); }
  @media (max-width: 720px) { header.site { padding: 16px 16px; } header.site .site-title { font-size: 1.15rem; } header.site .site-cta { padding: 9px 14px; font-size: 13px; } }

  /* Values page: photo background (the hero from themomentumcycle.com) under a green tint, content on a cream card */
  body.photo main { background: linear-gradient(rgba(10,51,35,.55), rgba(10,51,35,.70)), url("../assets/together-trail.jpg") center / cover fixed; }
  body.photo .wrap { background: var(--cream); border-radius: 6px; margin: 56px auto 64px; padding: 48px 48px 56px;
    box-shadow: 0 18px 50px rgba(0,0,0,.25); max-width: 820px; }
  @media (max-width: 720px) {
    body.photo main { background-attachment: scroll; }
    body.photo .wrap { margin: 20px 12px 28px; width: auto; padding: 28px 20px 36px; }
  }
</style>
</head>

<header class="site">
  <a class="site-title" href="https://www.themomentumcycle.com">The Momentum Cycle</a>
  <a class="site-cta" href="https://www.skool.com/tandem-momentum-1737/about" target="_blank" rel="noopener">Join Our Community</a>
</header>

<main>
  <div class="wrap" id="app"></div>
</main>

<footer class="site">
  <div class="foot-title">The Momentum Cycle</div>
  <a href="https://www.themomentumcycle.com">themomentumcycle.com</a>
</footer>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
  const API_URL = "https://tmc-values.zkrunyon.workers.dev/submit";
  // Turnstile widget "Momentum assessments" (covers go.themomentumcycle.com + zkrunyon-ui.github.io).
  const TURNSTILE_SITE_KEY = "0x4AAAAAAFxNXMLD8Jkyaehu";
  const VALUES = [{"key": "wealth", "label": "Wealth", "short": "money, financial abundance, material comfort"}, {"key": "creativity", "label": "Creativity", "short": "self-expression, inventing and imagining new things"}, {"key": "discipline", "label": "Discipline", "short": "self-control, consistency, doing what you said you'd do"}, {"key": "family", "label": "Family", "short": "caring for and prioritizing loved ones"}, {"key": "meaningful_work", "label": "Meaningful Work", "short": "doing work that feels purposeful and impactful"}, {"key": "community", "label": "Community Contribution", "short": "helping others, making a difference around you"}, {"key": "freedom", "label": "Freedom", "short": "independence, ability to choose your own path"}, {"key": "peace", "label": "Peace", "short": "calm, low conflict, low stress, inner harmony"}, {"key": "success", "label": "Success", "short": "achieving goals, winning, getting results"}, {"key": "love", "label": "Love", "short": "deep emotional connection and intimacy"}, {"key": "loyalty", "label": "Loyalty", "short": "standing by people and commitments"}, {"key": "honesty", "label": "Honesty", "short": "truthfulness, transparency"}, {"key": "growth", "label": "Growth", "short": "learning, self-improvement, personal development, ambition"}, {"key": "friendship", "label": "Friendship", "short": "close, supportive relationships with friends"}, {"key": "respect", "label": "Respect & Recognition", "short": "feeling appreciated and valued by others"}, {"key": "adventure", "label": "Adventure", "short": "excitement, new experiences, risk-taking"}, {"key": "health", "label": "Health", "short": "physical and mental well-being"}, {"key": "security", "label": "Security", "short": "feeling safe, stable, and free from major threats or chaos"}];
  const BY_KEY = Object.fromEntries(VALUES.map(v => [v.key, v]));
  const SHARE_URL = "https://go.themomentumcycle.com/values/";

  // Shuffle once per visit, like the old form, so position doesn't bias picks.
  const ORDER = VALUES.map(v => v.key).sort(() => Math.random() - 0.5);

  const state = {
    step: "intro", name: "", email: "", spouseName: "", spouseEmail: "",
    picked: [], ranked: [], sending: false, widgetId: null,
    id: (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16))),
  };
  const app = document.getElementById("app");
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const firstName = (s) => (String(s || "").trim().split(/\s+/)[0] || "");
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  function progress(n) {
    return `<div class="progress-bar"><div style="width:${n}%"></div></div>`;
  }

  function render() {
    ({ intro: renderIntro, pick: renderPick, rank: renderRank, details: renderDetails, result: renderResult })[state.step]();
    window.scrollTo(0, 0);
  }

  function renderIntro() {
    app.innerHTML = `
      <div class="eyebrow">A Free Values Assessment</div>
      <h1 class="hero">Discover your <em>top five values.</em></h1>
      <p class="lead">This short, 5-minute reflection helps you discover your top five personal values: the things that shape your choices, priorities, and connections. Married? You and your spouse can each take it to compare your results.</p>
      <form id="f" novalidate>
        <div class="field"><label for="name">Your full name</label>
          <input type="text" id="name" placeholder="eg. John Smith" maxlength="100" autocomplete="name" value="${escapeHtml(state.name)}"></div>
        <div class="form-error" id="err" role="alert"></div>
        <button class="btn" type="submit">Begin <span aria-hidden="true">→</span></button>
      </form>`;
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      if (name.length < 2) { document.getElementById("err").textContent = "Please enter your full name."; return; }
      state.name = name; state.step = "pick"; render();
    });
  }

  function renderPick() {
    const n = state.picked.length;
    app.innerHTML = `
      ${progress(25)}
      <div class="progress-meta"><span>Step <strong>1</strong> of 3</span><span><strong>${n}</strong> of 5 selected</span></div>
      <h2 class="q-title">Select the 5 values that feel <em>most important</em> to you right now.</h2>
      <p class="sub">Don't overthink it, go with what feels most true today.</p>
      <div class="vgrid" role="group" aria-label="Values">
        ${ORDER.map(k => { const v = BY_KEY[k], on = state.picked.includes(k), full = n >= 5 && !on; return `
          <button type="button" class="vcard${on ? " on" : ""}" data-k="${k}" aria-pressed="${on}" ${full ? "disabled" : ""}>
            <span class="vlabel">${escapeHtml(v.label)}</span><span class="vshort">${escapeHtml(v.short)}</span></button>`; }).join("")}
      </div>
      <div class="nav">
        <button class="btn btn-ghost" id="back">← Back</button>
        <button class="btn" id="next" ${n === 5 ? "" : "disabled"}>Next <span aria-hidden="true">→</span></button>
      </div>`;
    app.querySelectorAll(".vcard").forEach(el => el.addEventListener("click", () => {
      const k = el.dataset.k;
      if (state.picked.includes(k)) state.picked = state.picked.filter(x => x !== k);
      else if (state.picked.length < 5) state.picked.push(k);
      const y = window.scrollY; renderPick(); window.scrollTo(0, y);
    }));
    document.getElementById("back").addEventListener("click", () => { state.step = "intro"; render(); });
    document.getElementById("next").addEventListener("click", () => {
      // Keep any ranking already done for values still picked; append new ones.
      state.ranked = state.ranked.filter(k => state.picked.includes(k)).concat(state.picked.filter(k => !state.ranked.includes(k)));
      state.step = "rank"; render();
    });
  }

  function renderRank() {
    app.innerHTML = `
      ${progress(55)}
      <div class="progress-meta"><span>Step <strong>2</strong> of 3</span><span>Rank them</span></div>
      <h2 class="q-title">Now rank your 5 values from <em>most</em> to least important.</h2>
      <p class="sub">Having trouble? Imagine a moment where two of your values directly conflict, and ask yourself which one you would choose if you could only honor one.</p>
      <ol class="rank">${state.ranked.map((k, i) => `
        <li><span class="rnum">${i + 1}</span><span class="rlabel">${escapeHtml(BY_KEY[k].label)}</span>
          <span class="rbtns">
            <button type="button" class="rb" data-i="${i}" data-d="-1" aria-label="Move ${escapeHtml(BY_KEY[k].label)} up" ${i === 0 ? "disabled" : ""}>▲</button>
            <button type="button" class="rb" data-i="${i}" data-d="1" aria-label="Move ${escapeHtml(BY_KEY[k].label)} down" ${i === 4 ? "disabled" : ""}>▼</button>
          </span></li>`).join("")}</ol>
      <div class="nav">
        <button class="btn btn-ghost" id="back">← Back</button>
        <button class="btn" id="next">Next <span aria-hidden="true">→</span></button>
      </div>`;
    app.querySelectorAll(".rb").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i, j = i + +b.dataset.d;
      [state.ranked[i], state.ranked[j]] = [state.ranked[j], state.ranked[i]];
      const y = window.scrollY; renderRank(); window.scrollTo(0, y);
      const again = app.querySelector(`.rb[data-i="${j}"][data-d="${b.dataset.d}"]`) || app.querySelector(`.rb[data-i="${j}"]`);
      if (again) again.focus();
    }));
    document.getElementById("back").addEventListener("click", () => { state.step = "pick"; render(); });
    document.getElementById("next").addEventListener("click", () => { state.step = "details"; render(); });
  }

  function renderDetails() {
    app.innerHTML = `
      ${progress(85)}
      <div class="progress-meta"><span>Step <strong>3</strong> of 3</span><span>Your results</span></div>
      <h2 class="q-title">Where should we send <em>your results?</em></h2>
      <form id="f" novalidate>
        <div class="field"><label for="email">Your email</label>
          <input type="email" id="email" placeholder="you@email.com" maxlength="254" autocomplete="email" value="${escapeHtml(state.email)}"></div>
        <div class="spouse">
          <div class="spouse-title">Taking this with your spouse? <span>(optional)</span></div>
          <p class="sub" style="margin:0 0 14px">To get a side-by-side comparison, you each take the assessment and enter the other's email.</p>
          <div class="field"><label for="sname">Spouse's first name</label>
            <input type="text" id="sname" maxlength="100" value="${escapeHtml(state.spouseName)}"></div>
          <div class="field" style="margin-top:14px"><label for="semail">Spouse's email</label>
            <input type="email" id="semail" maxlength="254" value="${escapeHtml(state.spouseEmail)}"></div>
        </div>
        <div class="form-error" id="err" role="alert"></div>
        <div class="nav">
          <button class="btn btn-ghost" type="button" id="back">← Back</button>
          <button class="btn" type="submit">See My Values <span aria-hidden="true">→</span></button>
        </div>
      </form>`;
    document.getElementById("back").addEventListener("click", () => { saveDetails(); state.step = "rank"; render(); });
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault(); saveDetails();
      const err = document.getElementById("err");
      if (!EMAIL_RE.test(state.email)) { err.textContent = "Please enter a valid email address."; return; }
      if (state.spouseEmail && !EMAIL_RE.test(state.spouseEmail)) { err.textContent = "Please check your spouse's email, or leave it blank."; return; }
      if (state.spouseEmail && state.spouseEmail.toLowerCase() === state.email.toLowerCase()) { err.textContent = "Your spouse's email needs to be different from yours."; return; }
      state.step = "result"; render();
    });
  }
  function saveDetails() {
    state.email = document.getElementById("email").value.trim();
    state.spouseName = document.getElementById("sname").value.trim();
    state.spouseEmail = document.getElementById("semail").value.trim();
  }

  function renderResult() {
    app.innerHTML = `
      <div class="eyebrow">Your Result</div>
      <h1 class="hero" style="font-size:42px;">Your top <em>five values.</em></h1>
      <ol class="vresult" id="vresult">${state.ranked.map((k, i) => `
        <li><div class="vr-num">0${i + 1}</div><div><div class="vr-label serif">${escapeHtml(BY_KEY[k].label)}</div>
          <div class="vr-desc" data-k="${k}">${escapeHtml(BY_KEY[k].short)}</div></div></li>`).join("")}</ol>
      <div id="turnstileBox" class="turnstile-box"></div>
      <div id="sendStatus" class="send-status sending"><span class="spinner" aria-hidden="true"></span>
        <span>Sending your results to <strong>${escapeHtml(state.email)}</strong>…</span></div>
      <div id="spouseNote"></div>`;
    startCheck();
  }

  function setStatus(kind, html) { const el = document.getElementById("sendStatus"); if (el) { el.className = "send-status " + kind; el.innerHTML = html; } }
  function startCheck() {
    if (state.sending) return;
    if (!window.turnstile) { setTimeout(startCheck, 200); return; }
    if (state.widgetId !== null) { try { turnstile.remove(state.widgetId); } catch (e) {} }
    state.widgetId = turnstile.render("#turnstileBox", {
      sitekey: TURNSTILE_SITE_KEY, appearance: "interaction-only",
      callback: (token) => submit(token),
      "error-callback": () => showError("The security check couldn't load. Check your connection and try again."),
    });
  }
  function showError(msg) {
    state.sending = false;
    setStatus("error", `${escapeHtml(msg)} <a href="#" id="retry">Try again</a>.`);
    const a = document.getElementById("retry");
    if (a) a.addEventListener("click", (e) => { e.preventDefault();
      setStatus("sending", `<span class="spinner" aria-hidden="true"></span><span>Sending your results to <strong>${escapeHtml(state.email)}</strong>…</span>`);
      startCheck(); });
  }
  function spouseNote(r) {
    const el = document.getElementById("spouseNote"); if (!el) return;
    const who = escapeHtml(firstName(state.spouseName) || "your spouse");
    let html = "";
    if (r && r.couple === "sent") html = `<p><strong>${who === "your spouse" ? "Your spouse" : who} already took it.</strong> Your side-by-side comparison is on its way to you both.</p>`;
    else if (state.spouseEmail) html = `<p>When ${who} takes the assessment and enters your email, you'll both get a comparison of your values.</p>
      <button type="button" class="btn btn-ghost" id="copy">Copy link for ${who}</button>`;
    else html = `<p>Married? Have your spouse take it too, and enter each other's emails to get a side-by-side comparison.</p>
      <button type="button" class="btn btn-ghost" id="copy">Copy link to share</button>`;
    el.className = "spouse-note"; el.innerHTML = html;
    const c = document.getElementById("copy");
    if (c) c.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(SHARE_URL); c.textContent = "Link copied"; } catch (e) { c.textContent = SHARE_URL; }
    });
  }
  async function submit(token) {
    if (state.sending) return;
    state.sending = true;
    try {
      const resp = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: state.id, name: state.name, email: state.email, spouseName: state.spouseName,
          spouseEmail: state.spouseEmail, values: state.ranked, turnstileToken: token }) });
      const data = await resp.json().catch(() => ({}));
      if (data.result && data.result.values) data.result.values.forEach(v => {
        const el = app.querySelector(`.vr-desc[data-k="${v.key}"]`); if (el) el.textContent = v.description; });
      if (data.success) {
        setStatus("sent", `<span class="check" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span>Sent. Check your inbox at <strong>${escapeHtml(state.email)}</strong>.</span>`);
        spouseNote(data.result);
        return;
      }
      showError(data.error || "Something went wrong.");
    } catch (err) { showError("We couldn't reach the server. Check your connection."); }
  }
  render();
</script>
</body>
</html>
